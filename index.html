<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ёжик идёт к бабушке</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #2f3428;
    font-family: Arial, sans-serif;
}

/* =========================
   ИГРОВОЕ ПОЛЕ 16:9
========================= */

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#game {
    position: relative;

    width: 100vw;
    height: 56.25vw;

    max-width: 177.78vh;
    max-height: 100vh;

    overflow: hidden;

    background-image: url("fon.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


/* =========================
   ИНСТРУКЦИЯ
========================= */

#instruction {

    position: absolute;

    top: 3%;
    left: 50%;

    transform: translateX(-50%);

    z-index: 50;

    padding: 11px 25px;

    background: rgba(255,255,255,.92);

    border-radius: 28px;

    box-shadow:
        0 4px 14px rgba(0,0,0,.18);

    color: #654322;

    font-size: clamp(15px,1.7vw,28px);

    font-weight: 800;

    white-space: nowrap;
}


/* =========================
   ЁЖИК
========================= */

#hedgehog {

    position: absolute;

    width: 10%;

    left: 2%;
    top: 70%;

    z-index: 30;

    transition:
        left 1.35s ease-in-out,
        top 1.35s ease-in-out;

    transform-origin: center bottom;
}

#hedgehog img {

    display: block;

    width: 100%;
    height: auto;

    pointer-events: none;
}


/* Покачивание во время ходьбы */

#hedgehog.walking {

    animation:
        walkingBob .24s infinite alternate ease-in-out;
}

@keyframes walkingBob {

    from {
        transform:
            translateY(0)
            rotate(-2deg);
    }

    to {
        transform:
            translateY(-6px)
            rotate(2deg);
    }
}


/* =========================
   СЛОГИ
========================= */

.stop {

    position: absolute;

    width: 7.5%;
    aspect-ratio: 1 / 1;

    display: flex;

    justify-content: center;
    align-items: center;

    cursor: pointer;

    user-select: none;

    z-index: 20;

    transition:
        transform .2s,
        opacity .25s,
        filter .25s;
}


/* ТЕКСТ */

.stop span {

    position: relative;

    z-index: 5;

    font-size: clamp(16px,2vw,34px);

    font-weight: 900;

    color: #54321c;

    text-shadow:
        0 2px 2px rgba(255,255,255,.8);
}


/* =========================
   ЛИСТИК
========================= */

.leaf {

    background:
        linear-gradient(
            145deg,
            #f8c64c,
            #dd812b
        );

    border-radius:
        65% 25%
        65% 25%;

    box-shadow:
        0 5px 8px rgba(0,0,0,.18);

    transform: rotate(10deg);
}

.leaf span {

    transform: rotate(-10deg);
}


/* =========================
   ЖЁЛУДЬ
========================= */

.acorn {

    width: 6.5%;

    background:
        linear-gradient(
            #b7793d,
            #8c542c
        );

    border-radius:
        45% 45%
        60% 60%;

    box-shadow:
        0 5px 8px rgba(0,0,0,.18);
}

.acorn::before {

    content: "";

    position: absolute;

    width: 95%;
    height: 28%;

    top: -6%;

    background: #684125;

    border-radius: 50%;
}


/* =========================
   ГРИБОК
========================= */

.mushroom {

    width: 7%;

    height: 6%;

    background:
        linear-gradient(
            #e77b48,
            #b94e32
        );

    border-radius:
        55% 55%
        25% 25%;

    box-shadow:
        0 5px 8px rgba(0,0,0,.18);
}

.mushroom::after {

    content: "";

    position: absolute;

    width: 35%;
    height: 70%;

    left: 32%;
    top: 65%;

    background: #f3dfb7;

    border-radius:
        4px 4px
        10px 10px;

    z-index: -1;
}


/* =========================
   СОСТОЯНИЯ
========================= */

.stop.locked {

    opacity: .68;

    filter:
        grayscale(.35);

    cursor: default;
}


.stop.current {

    opacity: 1;

    filter: none;

    animation:
        pulse 1s infinite;
}


@keyframes pulse {

    0%,100% {

        scale: 1;

    }

    50% {

        scale: 1.12;

    }

}


.stop.done {

    opacity: .25;

    pointer-events: none;
}


/* =========================
   БАБУШКА
========================= */

#grandma {

    position: absolute;

    width: 10%;

    right: 7%;
    top: 47%;

    z-index: 28;

    opacity: 0;

    transform:
        scale(.3)
        translateY(20px);

    transition:
        opacity .7s,
        transform .7s;
}


#grandma img {

    width: 100%;

    display: block;
}


#grandma.show {

    opacity: 1;

    transform:
        scale(1)
        translateY(0);
}


/* =========================
   СЕРДЕЧКИ
========================= */

.heart {

    position: absolute;

    z-index: 60;

    pointer-events: none;

    font-size:
        clamp(20px,3vw,48px);

    animation:
        heartFly 2.2s ease-out forwards;
}


@keyframes heartFly {

    0% {

        opacity: 0;

        transform:
            translateY(0)
            scale(.4);

    }

    20% {

        opacity: 1;

    }

    100% {

        opacity: 0;

        transform:
            translateY(-150px)
            scale(1.3);

    }

}


/* =========================
   ФИНАЛЬНАЯ НАДПИСЬ
========================= */

#finish {

    position: absolute;

    top: 18%;
    left: 50%;

    transform:
        translateX(-50%)
        scale(.6);

    padding:
        14px 30px;

    border-radius:
        30px;

    background:
        rgba(255,255,255,.94);

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.18);

    color: #8a4d2d;

    font-size:
        clamp(18px,2.3vw,38px);

    font-weight: 900;

    opacity: 0;

    z-index: 70;

    transition: .5s;

    pointer-events: none;
}


#finish.show {

    opacity: 1;

    transform:
        translateX(-50%)
        scale(1);

}


/* =========================
   КНОПКА
========================= */

#restart {

    position: absolute;

    left: 50%;
    bottom: 3%;

    transform:
        translateX(-50%);

    padding:
        11px 24px;

    border: none;

    border-radius:
        25px;

    background:
        #e89842;

    color: white;

    font-size:
        clamp(14px,1.5vw,23px);

    font-weight: 800;

    cursor: pointer;

    z-index: 80;

    display: none;

    box-shadow:
        0 4px 10px
        rgba(0,0,0,.2);
}

</style>
</head>


<body>

<div id="game">


    <!-- ИНСТРУКЦИЯ -->

    <div id="instruction">
        🍂 Прочитай слог и помоги ёжику дойти до бабушки
    </div>



    <!-- СЛОГИ НА ДОРОЖКЕ -->


    <div
        class="stop leaf current"
        data-index="0"
        style="
        left:15%;
        top:72%;
        "
    >
        <span>ША</span>
    </div>



    <div
        class="stop acorn locked"
        data-index="1"
        style="
        left:27%;
        top:63%;
        "
    >
        <span>ШО</span>
    </div>



    <div
        class="stop mushroom locked"
        data-index="2"
        style="
        left:39%;
        top:68%;
        "
    >
        <span>ШУ</span>
    </div>



    <div
        class="stop leaf locked"
        data-index="3"
        style="
        left:49%;
        top:58%;
        "
    >
        <span>ШИ</span>
    </div>



    <div
        class="stop acorn locked"
        data-index="4"
        style="
        left:59%;
        top:63%;
        "
    >
        <span>АШ</span>
    </div>



    <div
        class="stop mushroom locked"
        data-index="5"
        style="
        left:69%;
        top:56%;
        "
    >
        <span>ОШ</span>
    </div>



    <div
        class="stop leaf locked"
        data-index="6"
        style="
        left:78%;
        top:58%;
        "
    >
        <span>УШ</span>
    </div>



    <!-- ЁЖИК -->

    <div id="hedgehog">

        <img
            src="ezhik.png"
            alt="Ёжик"
        >

    </div>



    <!--
    БАБУШКА

    Когда сделаем картинку,
    загрузи её как:

    babushka.png
    -->

    <div id="grandma">

        <img
            src="babushka.png"
            alt="Бабушка ежиха"
        >

    </div>



    <!-- ФИНАЛ -->

    <div id="finish">
        ❤️ Ура! Ёжик пришёл к бабушке!
    </div>


    <button id="restart">
        Пройти ещё раз
    </button>


</div>



<script>


/* =========================
   ЭЛЕМЕНТЫ
========================= */


const game =
    document.getElementById("game");


const hedgehog =
    document.getElementById("hedgehog");


const grandma =
    document.getElementById("grandma");


const finish =
    document.getElementById("finish");


const restart =
    document.getElementById("restart");


const stops =
    [...document.querySelectorAll(".stop")];



let current = 0;

let moving = false;



/* =========================
   ТОЧКИ ДВИЖЕНИЯ
========================= */


/*
Эти координаты соответствуют
новой длинной дорожке.

Их потом можно очень точно
подогнать под фон.
*/


const positions = [

    {
        left: 12,
        top: 68
    },

    {
        left: 24,
        top: 59
    },

    {
        left: 36,
        top: 64
    },

    {
        left: 46,
        top: 54
    },

    {
        left: 56,
        top: 59
    },

    {
        left: 66,
        top: 52
    },

    {
        left: 75,
        top: 54
    },

    /* НОРКА */

    {
        left: 84,
        top: 49
    }

];



/* =========================
   ШОРОХ ЛИСТЬЕВ
========================= */


let audioContext;

let rustleSource;

let rustleGain;



function startRustle() {


    audioContext =
        audioContext ||
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }


    const bufferSize =
        audioContext.sampleRate * 2;


    const buffer =
        audioContext.createBuffer(
            1,
            bufferSize,
            audioContext.sampleRate
        );


    const data =
        buffer.getChannelData(0);



    /*
    Создаём мягкий
    шорох сухих листьев
    */

    for (
        let i = 0;
        i < bufferSize;
        i++
    ) {


        const noise =
            Math.random() * 2 - 1;


        const crackle =
            Math.random() > .92
                ? .8
                : .16;


        data[i] =
            noise * crackle;

    }



    rustleSource =
        audioContext
        .createBufferSource();


    rustleSource.buffer =
        buffer;


    rustleSource.loop =
        true;



    const filter =
        audioContext
        .createBiquadFilter();


    filter.type =
        "bandpass";


    filter.frequency.value =
        1500;


    filter.Q.value =
        .65;



    rustleGain =
        audioContext
        .createGain();


    rustleGain.gain.value =
        .045;



    rustleSource
        .connect(filter)
        .connect(rustleGain)
        .connect(
            audioContext.destination
        );


    rustleSource.start();

}



/* =========================
   ОСТАНОВИТЬ ШОРОХ
========================= */


function stopRustle() {


    if (!rustleSource)
        return;


    try {


        rustleGain.gain
            .linearRampToValueAtTime(
                0.001,
                audioContext.currentTime
                + .15
            );


        setTimeout(
            () => {

                try {

                    rustleSource.stop();

                }

                catch(e) {}


                rustleSource =
                    null;

            },

            170
        );

    }

    catch(e) {}

}



/* =========================
   НАЖАТИЕ НА СЛОГ
========================= */


stops.forEach(
    stop => {


        stop.addEventListener(
            "click",
            () => {


                const index =
                    Number(
                        stop.dataset.index
                    );


                /*
                Можно нажать
                только активный слог
                */


                if (
                    index !== current ||
                    moving
                )
                    return;


                moveHedgehog(index);


            }
        );


    }
);



/* =========================
   ЁЖИК ИДЁТ
========================= */


function moveHedgehog(index) {


    moving = true;


    stops[index]
        .classList
        .remove("current");


    startRustle();


    hedgehog
        .classList
        .add("walking");



    const position =
        positions[index];



    hedgehog.style.left =
        position.left + "%";


    hedgehog.style.top =
        position.top + "%";



    setTimeout(
        () => {


            stopRustle();


            hedgehog
                .classList
                .remove("walking");


            stops[index]
                .classList
                .add("done");


            current++;


            moving =
                false;



            /* СЛЕДУЮЩИЙ СЛОГ */


            if (
                current <
                stops.length
            ) {


                stops[current]
                    .classList
                    .remove("locked");


                stops[current]
                    .classList
                    .add("current");


            }


            else {


                setTimeout(
                    goToGrandma,
                    350
                );


            }


        },

        1350
    );

}



/* =========================
   ИДЁМ К НОРКЕ
========================= */


function goToGrandma() {


    moving =
        true;


    startRustle();


    hedgehog
        .classList
        .add("walking");



    const finalPosition =
        positions[7];



    hedgehog.style.left =
        finalPosition.left + "%";


    hedgehog.style.top =
        finalPosition.top + "%";



    setTimeout(
        () => {


            stopRustle();


            hedgehog
                .classList
                .remove("walking");



            /*
            Бабушка появляется
            из норки
            */


            setTimeout(
                () => {


                    grandma
                        .classList
                        .add("show");



                    setTimeout(
                        () => {


                            createHearts();


                            finish
                                .classList
                                .add("show");


                            restart.style.display =
                                "block";


                        },

                        800
                    );


                },

                450
            );


        },

        1350
    );

}



/* =========================
   СЕРДЕЧКИ
========================= */


function createHearts() {


    for (
        let i = 0;
        i < 10;
        i++
    ) {


        setTimeout(
            () => {


                const heart =
                    document
                    .createElement(
                        "div"
                    );


                heart.className =
                    "heart";


                heart.textContent =
                    "❤️";


                heart.style.left =
                    (
                        78 +
                        Math.random() * 13
                    ) + "%";


                heart.style.top =
                    (
                        46 +
                        Math.random() * 12
                    ) + "%";


                game.appendChild(
                    heart
                );


                setTimeout(
                    () =>
                        heart.remove(),
                    2300
                );


            },

            i * 150
        );


    }

}



/* =========================
   НАЧАТЬ ЗАНОВО
========================= */


restart.addEventListener(
    "click",
    resetGame
);



function resetGame() {


    current =
        0;


    moving =
        false;



    hedgehog.style.left =
        "2%";


    hedgehog.style.top =
        "70%";



    grandma
        .classList
        .remove("show");


    finish
        .classList
        .remove("show");


    restart.style.display =
        "none";



    stops.forEach(
        (
            stop,
            index
        ) => {


            stop.classList.remove(
                "done",
                "current"
            );


            if (
                index === 0
            ) {


                stop
                    .classList
                    .remove(
                        "locked"
                    );


                stop
                    .classList
                    .add(
                        "current"
                    );


            }


            else {


                stop
                    .classList
                    .add(
                        "locked"
                    );


            }


        }
    );

}


</script>

</body>
</html>
