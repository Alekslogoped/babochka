<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ёжик идёт к бабушке</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eee8dc;
}

#game{
    position:relative;
    width:100vw;
    height:56.25vw;
    max-height:100vh;
    max-width:177.78vh;
    overflow:hidden;

    background:
        linear-gradient(
            to bottom,
            #cfe7ef 0%,
            #e7efd0 42%,
            #d4b56c 43%,
            #b9874c 100%
        );
}

/* ---------- Заголовок ---------- */

#instruction{
    position:absolute;
    top:3%;
    left:50%;
    transform:translateX(-50%);
    z-index:20;

    background:rgba(255,255,255,.92);
    padding:12px 25px;
    border-radius:25px;

    font-size:clamp(15px,2vw,30px);
    font-weight:bold;
    color:#6c4829;

    box-shadow:0 4px 10px rgba(0,0,0,.15);
    white-space:nowrap;
}

/* ---------- Дорожка ---------- */

.path{
    position:absolute;
    left:5%;
    right:7%;
    bottom:10%;
    height:43%;

    border-bottom:45px solid rgba(230,201,141,.85);
    border-radius:50%;
}

/* ---------- Декор ---------- */

.tree{
    position:absolute;
    font-size:clamp(70px,10vw,170px);
    opacity:.9;
    pointer-events:none;
}

.tree1{
    left:2%;
    top:12%;
}

.tree2{
    left:23%;
    top:8%;
}

.tree3{
    right:22%;
    top:9%;
}

/* ---------- Слоги ---------- */

.stop{
    position:absolute;
    width:8%;
    aspect-ratio:1/1;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:clamp(17px,2.3vw,36px);
    font-weight:900;
    color:#55361e;

    cursor:pointer;
    user-select:none;

    transition:
        transform .2s,
        filter .2s,
        opacity .3s;

    z-index:8;
}

.stop:hover{
    transform:scale(1.12);
}

.stop.locked{
    cursor:default;
    filter:grayscale(.6);
    opacity:.7;
}

.stop.current{
    animation:pulse 1.1s infinite;
    filter:none;
    opacity:1;
}

.stop.done{
    opacity:.35;
    pointer-events:none;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.12);
    }
}

/* лист */

.leaf{
    background:#e5a536;
    border-radius:70% 25% 70% 25%;
    transform:rotate(15deg);
}

.leaf span{
    transform:rotate(-15deg);
}

/* гриб */

.mushroom{
    background:#d87646;
    border-radius:55% 55% 25% 25%;
}

.mushroom::after{
    content:"";
    position:absolute;
    width:40%;
    height:45%;
    background:#f6e5bd;
    bottom:-25%;
    border-radius:10px;
    z-index:-1;
}

/* жёлудь */

.acorn{
    background:#9a6537;
    border-radius:45% 45% 60% 60%;
}

.acorn::before{
    content:"";
    position:absolute;
    width:90%;
    height:30%;
    background:#694427;
    top:-7%;
    border-radius:50%;
}

/* ---------- Ёжик ---------- */

#hedgehog{
    position:absolute;
    width:10%;
    aspect-ratio:1/1;

    left:3%;
    top:67%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:clamp(45px,7vw,105px);

    z-index:15;

    transition:
        left 1.25s ease-in-out,
        top 1.25s ease-in-out;

    transform-origin:center bottom;
}

#hedgehog.walking{
    animation:waddle .25s infinite alternate;
}

@keyframes waddle{
    from{
        transform:translateY(0) rotate(-2deg);
    }
    to{
        transform:translateY(-7px) rotate(2deg);
    }
}

/* ---------- Дом бабушки ---------- */

#house{
    position:absolute;
    right:2%;
    bottom:12%;

    width:16%;
    height:29%;

    background:#86613e;
    border-radius:50% 50% 10% 10%;

    z-index:5;

    box-shadow:
        inset 0 0 0 8px rgba(82,50,25,.18),
        0 7px 10px rgba(0,0,0,.18);
}

#house::before{
    content:"🍂";
    position:absolute;
    font-size:clamp(35px,6vw,90px);
    top:-35%;
    left:30%;
}

#door{
    position:absolute;
    width:43%;
    height:62%;
    left:29%;
    bottom:0;

    background:#49331f;
    border-radius:50% 50% 5px 5px;

    transition:transform .6s;
    transform-origin:left;
}

#house.open #door{
    transform:perspective(400px) rotateY(-75deg);
}

/* ---------- Бабушка ---------- */

#grandma{
    position:absolute;
    right:6%;
    top:59%;

    width:10%;
    aspect-ratio:1;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:clamp(45px,7vw,100px);

    opacity:0;
    transform:scale(.3);

    z-index:14;

    transition:
        opacity .6s,
        transform .6s,
        right .8s;
}

#grandma.show{
    opacity:1;
    transform:scale(1);
    right:12%;
}

/* ---------- Сердечки ---------- */

.heart{
    position:absolute;
    z-index:30;

    font-size:clamp(22px,3vw,48px);

    pointer-events:none;

    animation:heartUp 2s ease-out forwards;
}

@keyframes heartUp{
    0%{
        transform:translateY(0) scale(.4);
        opacity:0;
    }

    25%{
        opacity:1;
    }

    100%{
        transform:translateY(-150px) scale(1.3);
        opacity:0;
    }
}

/* ---------- Финал ---------- */

#finish{
    position:absolute;
    left:50%;
    top:24%;
    transform:translate(-50%,-50%) scale(.5);

    background:white;
    padding:18px 32px;

    border-radius:30px;

    font-size:clamp(20px,3vw,42px);
    font-weight:bold;

    color:#8a4c31;

    opacity:0;
    pointer-events:none;

    z-index:40;

    transition:.5s;

    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

#finish.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

#restart{
    position:absolute;
    left:50%;
    bottom:3%;

    transform:translateX(-50%);

    padding:12px 25px;

    border:0;
    border-radius:25px;

    background:#e79b45;
    color:white;

    font-size:clamp(15px,1.6vw,24px);
    font-weight:bold;

    cursor:pointer;

    z-index:50;

    display:none;
}

</style>
</head>

<body>

<div id="game">

    <div id="instruction">
        🍁 Прочитай слог и помоги ёжику дойти до бабушки
    </div>

    <div class="tree tree1">🌳</div>
    <div class="tree tree2">🌲</div>
    <div class="tree tree3">🌳</div>

    <div class="path"></div>

    <!-- Остановки -->

    <div class="stop leaf current"
         data-index="0"
         style="left:14%; top:68%;">
        <span>ША</span>
    </div>

    <div class="stop mushroom locked"
         data-index="1"
         style="left:27%; top:58%;">
        <span>ШО</span>
    </div>

    <div class="stop acorn locked"
         data-index="2"
         style="left:40%; top:67%;">
        <span>ШУ</span>
    </div>

    <div class="stop leaf locked"
         data-index="3"
         style="left:51%; top:53%;">
        <span>ШИ</span>
    </div>

    <div class="stop mushroom locked"
         data-index="4"
         style="left:62%; top:64%;">
        <span>АШ</span>
    </div>

    <div class="stop acorn locked"
         data-index="5"
         style="left:71%; top:51%;">
        <span>ОШ</span>
    </div>

    <div class="stop leaf locked"
         data-index="6"
         style="left:78%; top:65%;">
        <span>УШ</span>
    </div>

    <!-- Ёжик -->

    <div id="hedgehog">🦔</div>

    <!-- Норка -->

    <div id="house">
        <div id="door"></div>
    </div>

    <!-- Бабушка -->

    <div id="grandma">🦔</div>

    <div id="finish">
        ❤️ Ёжик пришёл к бабушке! ❤️
    </div>

    <button id="restart">
        Пройти ещё раз
    </button>

</div>

<script>

/* ===========================
   ОСНОВНЫЕ ПЕРЕМЕННЫЕ
=========================== */

const hedgehog = document.getElementById("hedgehog");
const grandma = document.getElementById("grandma");
const house = document.getElementById("house");
const finish = document.getElementById("finish");
const restart = document.getElementById("restart");

const stops = [...document.querySelectorAll(".stop")];

let current = 0;
let moving = false;


/* ===========================
   ТОЧКИ ДВИЖЕНИЯ ЁЖИКА
=========================== */

const positions = [

    {left:12, top:64},
    {left:25, top:54},
    {left:38, top:63},
    {left:49, top:49},
    {left:60, top:60},
    {left:69, top:47},
    {left:76, top:61},

    // финальная точка около норки
    {left:84, top:62}

];


/* ===========================
   ЗВУК ШОРОХА
=========================== */

let audioContext;
let rustleSource;
let rustleGain;

function startRustle(){

    audioContext =
        audioContext ||
        new (window.AudioContext || window.webkitAudioContext)();

    const bufferSize =
        audioContext.sampleRate * 2;

    const buffer =
        audioContext.createBuffer(
            1,
            bufferSize,
            audioContext.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    /*
       Создаём мягкий шум.
       Он имитирует движение
       по сухим листьям.
    */

    for(let i=0;i<bufferSize;i++){

        data[i] =
            (Math.random()*2-1) *
            (Math.random()>.65 ? .7 : .18);

    }

    rustleSource =
        audioContext.createBufferSource();

    rustleSource.buffer = buffer;
    rustleSource.loop = true;


    /* фильтр делает звук мягче */

    const filter =
        audioContext.createBiquadFilter();

    filter.type = "bandpass";

    filter.frequency.value = 1800;

    filter.Q.value = .7;


    rustleGain =
        audioContext.createGain();

    rustleGain.gain.value = .07;


    rustleSource
        .connect(filter)
        .connect(rustleGain)
        .connect(audioContext.destination);


    rustleSource.start();

}


/* остановка шороха */

function stopRustle(){

    if(!rustleSource) return;

    try{

        rustleGain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + .15
        );

        setTimeout(()=>{

            try{
                rustleSource.stop();
            }catch(e){}

            rustleSource = null;

        },180);

    }catch(e){}

}


/* ===========================
   НАЖАТИЕ НА СЛОГ
=========================== */

stops.forEach(stop=>{

    stop.addEventListener("click",()=>{

        const index =
            Number(stop.dataset.index);

        /*
        Нельзя нажать следующий слог,
        пока ребёнок не прошёл предыдущий.
        */

        if(index !== current || moving)
            return;


        moveHedgehog(index);

    });

});


/* ===========================
   ДВИЖЕНИЕ
=========================== */

function moveHedgehog(index){

    moving = true;

    stops[index].classList.remove("current");

    startRustle();

    hedgehog.classList.add("walking");


    const pos =
        positions[index];


    hedgehog.style.left =
        pos.left + "%";

    hedgehog.style.top =
        pos.top + "%";


    /*
       Через 1.25 секунды
       ёжик останавливается.
    */

    setTimeout(()=>{

        stopRustle();

        hedgehog.classList.remove("walking");

        stops[index].classList.add("done");

        current++;

        moving = false;


        /* следующий слог */

        if(current < stops.length){

            stops[current]
                .classList
                .remove("locked");

            stops[current]
                .classList
                .add("current");

        }

        else{

            /*
            Все слоги прочитаны.
            Идём к бабушке.
            */

            setTimeout(
                goToGrandma,
                350
            );

        }

    },1250);

}


/* ===========================
   ФИНАЛ
=========================== */

function goToGrandma(){

    moving = true;

    startRustle();

    hedgehog.classList.add("walking");

    hedgehog.style.left =
        positions[7].left + "%";

    hedgehog.style.top =
        positions[7].top + "%";


    setTimeout(()=>{

        stopRustle();

        hedgehog.classList.remove("walking");

        /*
        Открываем норку
        */

        house.classList.add("open");


        setTimeout(()=>{

            /*
            Выходит бабушка
            */

            grandma.classList.add("show");


            setTimeout(()=>{

                createHearts();

                finish.classList.add("show");

                restart.style.display =
                    "block";

            },700);


        },550);


    },1300);

}


/* ===========================
   СЕРДЕЧКИ
=========================== */

function createHearts(){

    const game =
        document.getElementById("game");


    for(let i=0;i<8;i++){

        setTimeout(()=>{

            const heart =
                document.createElement("div");

            heart.className =
                "heart";

            heart.innerHTML =
                "❤️";


            heart.style.left =
                (79 + Math.random()*12) + "%";

            heart.style.top =
                (55 + Math.random()*10) + "%";


            game.appendChild(heart);


            setTimeout(
                ()=>heart.remove(),
                2100
            );


        },i*170);

    }

}


/* ===========================
   ПОВТОР ИГРЫ
=========================== */

restart.addEventListener(
    "click",
    resetGame
);


function resetGame(){

    current = 0;
    moving = false;

    hedgehog.style.left =
        "3%";

    hedgehog.style.top =
        "67%";


    grandma.classList.remove(
        "show"
    );

    house.classList.remove(
        "open"
    );

    finish.classList.remove(
        "show"
    );

    restart.style.display =
        "none";


    stops.forEach(
        (stop,index)=>{

            stop.classList.remove(
                "done",
                "current"
            );

            if(index===0){

                stop.classList.remove(
                    "locked"
                );

                stop.classList.add(
                    "current"
                );

            }

            else{

                stop.classList.add(
                    "locked"
                );

            }

        }
    );

}

</script>

</body>
</html>
